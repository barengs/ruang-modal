services:
  app:
    image: "${APP_IMAGE:-ghcr.io/barengs/ruang-modal:latest}"
    container_name: ruang_modal_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8083}:80"
    env_file:
      - .env
    environment:
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      DB_CONNECTION: "${DB_CONNECTION:-mysql}"
      DB_HOST: "${DB_HOST:-db}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_DATABASE: "${DB_DATABASE:-ruang_modal}"
      DB_USERNAME: "${DB_USERNAME:-ruang_modal}"
      DB_PASSWORD: "${DB_PASSWORD}"
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
      RUN_SEEDER: "${RUN_SEEDER:-false}"
      RUN_QUEUE_WORKER: "${RUN_QUEUE_WORKER:-true}"
    volumes:
      - app_storage:/var/www/html/storage/app/public
      - app_logs:/var/www/html/storage/logs
      - app_sqlite:/var/www/html/database
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ruang_modal_net

  db:
    image: mysql:8.4
    container_name: ruang_modal_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-ruang_modal}"
      MYSQL_USER: "${DB_USERNAME:-ruang_modal}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      TZ: "Asia/Jakarta"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u$$MYSQL_USER", "-p$$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - ruang_modal_net

volumes:
  app_storage:
  app_logs:
  app_sqlite:
  db_data:

networks:
  ruang_modal_net:
    driver: bridge
